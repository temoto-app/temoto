<svg xmlns="http://www.w3.org/2000/svg" width="640" height="128" viewBox="0 0 640 128" role="img" aria-label="Download for macOS (Apple silicon)">
  <!-- The download button shown at the top of each Release's notes (scripts/release-config.mjs, releaseNotesText). Colors follow build/icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#37406b"/>
      <stop offset="0.5" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0c0f1e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9df6e3"/>
      <stop offset="1" stop-color="#57a9ff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="636" height="124" rx="28" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="635" height="123" rx="27.5" fill="none" stroke="#8fb6ff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Arrow into a tray -->
  <g fill="none" stroke="url(#mark)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 30 V78"/>
    <path d="M56 58 L78 80 L100 58"/>
    <path d="M46 84 V98 H110 V84"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="146" y="62" font-size="38" font-weight="700" fill="#ffffff">Download for macOS</text>
    <text x="147" y="96" font-size="22" font-weight="500" fill="#b9c6f2">Apple silicon · DMG installer</text>
  </g>
</svg>

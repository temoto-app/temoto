<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP (TODO 405, review C-2). The PDF content comes from the host as `aios-res://local/<token>/…` and is read with
      fetch (`connect-src aios-res:`). The pdf.js worker is bundled (`vendor/`); a document with an opaque origin
      cannot create a Worker from an aios-plugin: URL, so a data: module worker imports it
      (`worker-src data:`, the import target is allowed by `script-src aios-plugin:`). **A blob: worker cannot be used**:
      Chromium rejects a blob: worker created by an opaque-origin document as a "cross-origin redirect" (confirmed on a real machine).
      A data: worker inherits the document's CSP. CMap / wasm are fetched by the main thread and handed to the worker
      (`connect-src aios-plugin:`). For the standard 14 fonts that are not embedded, pdf.js reads the bundled .ttf files through FontFace
      url() (`font-src aios-plugin:`). `'wasm-unsafe-eval'` is for the wasm that decodes JPEG 2000 / JBIG2
      (JS eval stays closed).
      `blob:` is for the temporary view of a file inside a zip (TODO 905): the bridge turns the bytes it received from the host into a blob: URL inside the iframe.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src aios-plugin: 'wasm-unsafe-eval'; worker-src data:; style-src aios-plugin: 'unsafe-inline'; img-src blob: data:; font-src aios-plugin: data: blob:; connect-src aios-res: aios-plugin: blob:"
    />
    <title>aios.pdf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      The CSP allows only what this viewer needs (review C-2, TODO 405).
      - The content comes from the host as `aios-res://local/<token>/…` and is read with fetch, hence `connect-src aios-res:`.
      - Images in .docx are embedded as data URLs by mammoth, hence `img-src data:` (external images are not loaded).
      - Conversion runs synchronously inside the iframe (no Worker, no eval).
      `blob:` is for the temporary view of a file inside a zip (TODO 905): the bridge turns the bytes it received from the host into a blob: URL inside the iframe.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src aios-plugin:; style-src aios-plugin: 'unsafe-inline'; img-src data:; connect-src aios-res: blob:"
    />
    <title>aios.office</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

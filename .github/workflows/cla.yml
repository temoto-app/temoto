# Collect CLA signatures on pull requests.
# Signatures are recorded in signatures/version1/cla.json on the `cla-signatures` branch (so main stays clean).
# Even with pull_request_target, the PR's code is never checked out (this action only touches the PR comments and the signatures JSON).
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/temoto-app/temoto/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'beep8,dependabot[bot],github-actions[bot]'
